[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pespace"
authors = [
    {name = "Rui Niu", email = "nrui@mail.ustc.edu.cn"},
]
description = "A tool for parameter estimation with space-borne gravitational-wave detectors."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha", 
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "taichi != 1.7.1", 
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "tiwave",
]
keywords = ["gravitational-wave", "taichi-lang", "jax", "parameter estimation"]
dynamic = ["version"]

[project.optional-dependencies]
# JAX back end: differentiable detector response, Whittle likelihood and
# Fisher matrix (pespace.inference.fisher, likelihood_jax, detector/_jax_impl).
jax = ["jax"]

# Sampler back ends. All of them build on NumpyroPriorSamplerBase, so numpyro
# is required; corner is imported at module level by blackjax_smc for its
# diagnostic plots. jaxns pulls in tfp-nightly (the tensorflow_probability
# jax substrate) by itself.
samplers = [
    "jax",
    "numpyro",
    "blackjax",
    "flowMC",
    "jaxns",
    "corner",
]

# External parameter-estimation interfaces.
bilby = ["bilby"]
pycbc = ["pycbc"]
# Needed by the lalsimulation waveform interface (import lal / lalsimulation).
lalsimulation = ["lalsuite"]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "mypy",
    "sphinx",
]

[project.urls]
Documentation = "https://github.com/nnrui/pespace"
Repository = "https://github.com/nnrui/pespace"

[tool.setuptools.packages.find]
include = ["pespace*"]
