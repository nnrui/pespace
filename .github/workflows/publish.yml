name: Publish Python package

on:
  push:
    branches: ["master"]
    tags: ["v[0-9]*"]

permissions:
  contents: read

# A branch push and a tag push can refer to the same commit.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: |
          # TODO: Replace this step with module tests, e.g. python -m pytest.
          echo "Module tests are not implemented yet."
          exit 0

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and all tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Release tags must point at commits that are already in master.
      - name: Reject release tags outside master
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor HEAD origin/master ||
            { echo "::error::Tag ${GITHUB_REF_NAME} is not on master; nothing was published."; exit 1; }

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      # The version comes from git tags via setuptools-scm.
      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  # A v tag means a real release.
  publish-pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/

      # Configure this workflow as a Trusted Publisher on PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Allow reruns and duplicate branch/tag events for the same version.
          skip-existing: true

  # Every push to master means a development snapshot.
  publish-testpypi:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/

      # Configure this workflow as a Trusted Publisher on TestPyPI.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
