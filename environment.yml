name: pespace
channels:
  - conda-forge
dependencies:
  # python
  - python = 3.12
  - pip
  # data analysis
  - ipykernel
  - bilby
  - pycbc
  - pandas
  - numpy
  - scipy
  - matplotlib
  - multinest
  - pymultinest
  - mpi4py
  - mpich
  # development tools
  - pytest
  - pytest-cov
  - black
  - mypy
  - sphinx
  # cuda-toolkit
  - cuda-version = 12.4
  - cuda-toolkit
  - pip:
    - taichi
    - "jax[cuda12]"
    - blackjax
    - numpyro
